{% extends "_login.html" %}
{% block extra %}
<div class="divider">or use your phone</div>
{% if request.query_params.get('otp') %}
<form method="post" action="/otp/verify" class="stack">
  <div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" maxlength="6" required></div>
  <div class="field"><label>Your name (new accounts)</label><input name="full_name"></div>
  <button class="btn block sec">Verify & sign in</button>
</form>
{% else %}
<form method="post" action="/otp/request" class="row">
  <input name="phone" placeholder="+91 98xxxxxxxx" required style="flex:1">
  <button class="btn sec">Send OTP</button>
</form>
{% endif %}
<div class="row" style="margin-top:10px">
  <button class="btn sec" style="flex:1" title="Requires GOOGLE_CLIENT_IDS configured" onclick="alert('Google Sign-In: add your OAuth client id (see README). The API endpoint /auth/google is ready.')"> Google</button>
  <button class="btn sec" style="flex:1" title="Requires APPLE_BUNDLE_IDS configured" onclick="alert('Sign in with Apple works in the iOS app; web needs a Services ID (see README).')"> Apple</button>
</div>
<details id="register" style="margin-top:16px"><summary>New here? Create an account</summary>
<form method="post" action="/register" style="margin-top:10px">
  <div class="field"><label>Full name</label><input name="full_name" required></div>
  <div class="field"><label>Email</label><input name="email" type="email" required></div>
  <div class="field"><label>Password (min 8)</label><input name="password" type="password" minlength="8" required></div>
  <button class="btn block">Create account</button>
</form></details>
{% endblock %}
