{% extends "layout.html" %}{% block heading %}Account security{% endblock %}
{% block content %}
<form method="post" action="/account" class="card" style="max-width:440px">
  {% if user.must_change_password %}<div class="flash error">You are using a temporary password issued by the admin team. Set your own password to continue.</div>{% endif %}
  <div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
  <div class="field"><label>New password (min 8)</label><input type="password" name="new_password" minlength="8" required></div>
  <button class="btn">Update password</button>
</form>
{% endblock %}
