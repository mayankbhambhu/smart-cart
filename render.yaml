# Render Blueprint: 1 Postgres + API + 3 dashboards, each with its own live URL.
# plan: free keeps it free. Free services sleep after ~15 idle minutes (the first visit then takes
# about a minute) and a free database expires after 30 days. Change the plans to paid ones to avoid that.
databases:
  - name: freshflow-db
    plan: free
services:
  - type: web
    name: freshflow-api
    runtime: python
    plan: free
    rootDir: backend/api
    buildCommand: pip install -r requirements.txt
    # seeds the demo stores the first time only (it skips when data exists)
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: freshflow-db, property: connectionString } }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DEBUG, value: "false" }
      - { key: PAYMENTS_MODE, value: mock }
      - { key: SEED_PASSWORD, generateValue: true }   # password of the demo accounts: see it in the Render dashboard
      - { key: API_PUBLIC_URL, value: https://freshflow-api.onrender.com }
      - { key: EMAIL_LINK_CONTINUE_URL, value: https://freshflow-shop.onrender.com/auth/email-link }
      - { key: SSO_ALLOWED_REDIRECTS, value: "https://freshflow-shop.onrender.com/,https://freshflow-store.onrender.com/,https://freshflow-admin.onrender.com/,freshflow://" }
  - type: web
    name: freshflow-shop          # Customer dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r backend/web/requirements.txt
    startCommand: cd backend && uvicorn web.customer.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - { key: API_URL, value: https://freshflow-api.onrender.com }
      - { key: PUBLIC_API_URL, value: https://freshflow-api.onrender.com }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: SHOW_DEMO_ACCOUNTS, value: "false" }
      - { key: SUPPORT_EMAIL, sync: false }   # your contact email, asked for when you create the Blueprint
      - { key: CUSTOMER_APP_URL, value: https://freshflow-shop.onrender.com }
      - { key: STORE_APP_URL, value: https://freshflow-store.onrender.com }
      - { key: ADMIN_APP_URL, value: https://freshflow-admin.onrender.com }
  - type: web
    name: freshflow-store         # Store operations dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r backend/web/requirements.txt
    startCommand: cd backend && uvicorn web.store.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - { key: API_URL, value: https://freshflow-api.onrender.com }
      - { key: PUBLIC_API_URL, value: https://freshflow-api.onrender.com }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: SHOW_DEMO_ACCOUNTS, value: "false" }
      - { key: SUPPORT_EMAIL, sync: false }   # your contact email, asked for when you create the Blueprint
      - { key: CUSTOMER_APP_URL, value: https://freshflow-shop.onrender.com }
      - { key: STORE_APP_URL, value: https://freshflow-store.onrender.com }
      - { key: ADMIN_APP_URL, value: https://freshflow-admin.onrender.com }
  - type: web
    name: freshflow-admin         # Admin operations dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r backend/web/requirements.txt
    startCommand: cd backend && uvicorn web.admin.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - { key: API_URL, value: https://freshflow-api.onrender.com }
      - { key: PUBLIC_API_URL, value: https://freshflow-api.onrender.com }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: SHOW_DEMO_ACCOUNTS, value: "false" }
      - { key: SUPPORT_EMAIL, sync: false }   # your contact email, asked for when you create the Blueprint
      - { key: CUSTOMER_APP_URL, value: https://freshflow-shop.onrender.com }
      - { key: STORE_APP_URL, value: https://freshflow-store.onrender.com }
      - { key: ADMIN_APP_URL, value: https://freshflow-admin.onrender.com }
